<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-title"><i class="ti ti-tool-kitchen-2" style="color:#D85A30"></i> Shift Manager</div>
    <div class="login-subtitle">Sign in to view your schedule and manage shifts.</div>
    <div class="login-row">
      <label class="flabel">Email</label>
      <input type="email" id="login-email" placeholder="your@email.com" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px" />
    </div>
    <div class="login-row">
      <label class="flabel">Password</label>
      <input type="password" id="login-password" placeholder="Password" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:14px" />
    </div>
    <div id="login-error" style="color:red;font-size:13px;margin-bottom:8px;display:none"></div>
    <button class="btn-save" style="width:100%;justify-content:center;margin-top:8px" onclick="login()"><i class="ti ti-login"></i> Log in</button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="logo"><i class="ti ti-tool-kitchen-2"></i> Shift Manager</div>
    <div class="topbar-center">
      <button class="nav-btn" onclick="changeWeek(-1)"><i class="ti ti-chevron-left"></i></button>
      <div class="header-dates">
  <span class="today-label" id="todayLabelTop"></span>
  <span class="week-label" id="weekLabel"></span>
</div>
      <button class="nav-btn" onclick="changeWeek(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="user-chip" id="user-chip"></div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="tabs" id="tabs"></div>
      <div class="tab-content" id="tab-content"></div>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
