<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shift Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-title"><i class="ti ti-tool-kitchen-2" style="color:#D85A30"></i> Shift Manager Login</div>
    <div class="login-subtitle">Select a demo user. Managers go to the manager tools; employees only see their own job-type schedule and requests.</div>
    <div class="login-row">
      <label class="flabel">User</label>
      <select id="login-user"></select>
    </div>
    <button class="btn-save" style="width:100%;justify-content:center" onclick="login()"><i class="ti ti-login"></i> Log in</button>
    <div class="login-help" style="margin-top:14px">Prototype login only. Real app version would use usernames/passwords and database-backed permissions.</div>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="logo"><i class="ti ti-tool-kitchen-2"></i> Shift Manager</div>
    <div class="topbar-center">
      <button class="nav-btn" onclick="changeWeek(-1)"><i class="ti ti-chevron-left"></i></button>
      <span class="week-label" id="weekLabel"></span>
      <button class="nav-btn" onclick="changeWeek(1)"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="user-chip" id="user-chip"></div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content">
      <div class="tabs" id="tabs"></div>
      <div class="tab-content" id="tab-content"></div>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
